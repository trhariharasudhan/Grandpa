<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fafafb;
        background: #12141d;
      }
      .status {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid rgba(98, 68, 197, 0.45);
        border-radius: 10px;
        background: rgba(98, 68, 197, 0.16);
      }
      .muted { color: #aab0c5; font-size: 12px; }
      .ok { color: #ffc448; }
      button {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 9px;
        color: #fff;
        background: #6244c5;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <strong>Grandpa Page Adapter</strong>
    <div class="muted">Local visible-page context only.</div>
    <div class="status">
      <div id="state">Checking...</div>
      <div id="title" class="muted"></div>
      <div id="error" class="muted"></div>
    </div>
    <button id="refresh">Refresh Snapshot</button>
    <script src="popup.js"></script>
  </body>
</html>
