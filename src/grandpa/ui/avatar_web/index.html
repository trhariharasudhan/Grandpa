<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ws://127.0.0.1:* blob:; img-src 'self' data: blob:">
<title>Grandpa</title>
<link rel="stylesheet" href="avatar.css">
</head>
<body>
<main id="app" data-state="idle" data-panel="closed">
  <section id="presence" aria-live="polite">
    <button type="button" id="ring" aria-label="Open Grandpa's chat" aria-expanded="false" title="Standby">
      <span id="ring-core" aria-hidden="true"></span>
      <canvas id="ring-gl" aria-hidden="true"></canvas>
      <canvas id="char-gl" aria-hidden="true"></canvas>
    </button>
    <div id="status">
      <p id="label">Connecting...</p>
      <p id="action"></p>
    </div>
  </section>

  <section id="panel">
    <header id="bar" title="Drag to move">
      <span id="dot" aria-hidden="true"></span>
      <strong>Grandpa</strong>
      <span id="bar-status">Ready</span>
      <button type="button" id="open-app" class="small" hidden title="Open the full Grandpa app">Open app</button>
      <button type="button" id="quit" class="small" hidden title="Close the orb (the app stays open)">Quit</button>
      <button type="button" id="close" class="small" aria-label="Close the chat" title="Close the chat (Esc)">✕</button>
    </header>
    <ol id="history" aria-label="Conversation"></ol>
    <div id="confirm" hidden>
      <p id="question"></p>
      <button type="button" id="yes">Yes</button>
      <button type="button" id="no">No</button>
    </div>
    <form id="entry" autocomplete="off">
      <input id="text" type="text" maxlength="2000" placeholder="Ask Grandpa..." aria-label="Message">
      <button type="button" id="talk" title="Click, then say one sentence">Talk</button>
      <button type="submit" id="send">Send</button>
    </form>
  </section>
</main>
<script src="ring.js"></script>
<script src="avatar.js"></script>
<script type="module" src="character.js"></script>
</body>
</html>
