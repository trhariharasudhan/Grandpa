[skill]
name = "search-and-index"
description = "Search for documents matching a query and index them into memory for future retrieval"
version = "0.1.0"
author = "grandpa"
provenance = "bundled"

# Was `find {directory} -type f \( -name "*.txt" ... \) | head -50`. POSIX find
# plus `head`, neither of which behaves this way under cmd.exe -- Windows `find`
# is a string search tool and `head` does not exist. It returned nothing, and the
# skill reported Success with "No results found.", which reads as "the directory
# has no documents" rather than "the command could not run".
[[skill.steps]]
tool_name = "shell_exec"
arguments_template = '''{"command": "powershell -NoProfile -Command \"Get-ChildItem -LiteralPath '{directory}' -Recurse -File | Where-Object { $_.Extension -in '.txt','.md','.pdf' } | Select-Object -First 50 -ExpandProperty FullName\""}'''
output_key = "found_files"

[[skill.steps]]
tool_name = "think"
arguments_template = '{"thought": "Filter the found files to those likely relevant to the query: {query}. Files: {found_files}"}'
output_key = "relevant_files"

[[skill.steps]]
tool_name = "memory_index"
arguments_template = '{"path": "{directory}"}'
output_key = "index_result"

[[skill.steps]]
tool_name = "memory_search"
arguments_template = '{"query": "{query}"}'
output_key = "search_results"
