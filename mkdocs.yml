site_name: grandpa
site_url: https://grandpa.github.io/grandpa/
site_description: Personal AI, On Personal Devices
site_author: grandpa Contributors
repo_url: https://github.com/grandpa/grandpa
repo_name: grandpa/grandpa
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 grandpa Contributors

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font:
    text: Georgia
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      separator: '[\s\-\._]+'
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: numpy
            docstring_section_style: spacy
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            show_if_no_docstring: false
            inherited_members: false
            filters:
              - "!^_"
              - "^__init__$"
              - "^__all__$"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
      check_paths: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  version:
    default: v1.0.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grandpa/grandpa

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Daily Use Setup: getting-started/daily-use-setup.md
      - Configuration: getting-started/configuration.md
  - Architecture:
      - Overview: architecture/overview.md
      - Domain Boundaries: architecture/domain-architecture.md
      - Query Flow: architecture/query-flow.md
      - Security: architecture/security.md
  - User Guide:
      - CLI: user-guide/cli.md
      - Voice Operator: user-guide/voice-operator.md
      - Windows Automation: user-guide/windows-automation.md
      - Screen and OCR: user-guide/screen-and-ocr.md
      - Memory: user-guide/memory.md
      - Scheduler: user-guide/scheduler.md
      - Personal Integrations: user-guide/personal-integrations.md
      - Local API Server: user-guide/local-api-server.md
      - Security: user-guide/security.md
  - Development:
      - Repository Structure: development/repo-structure.md
      - Contributing: development/contributing.md
      - Local Artifacts: development/local-artifacts.md
      - Release Checklist: development/release-checklist.md
