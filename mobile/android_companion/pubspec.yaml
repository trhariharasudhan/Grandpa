name: grandpa_android_companion
description: Local-first Android companion app for Grandpa.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.2
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  speech_to_text: ^7.0.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
