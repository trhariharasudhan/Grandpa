# Grandpa local Windows assistant configuration

[engine]
default = "ollama"

[engine.ollama]
host = "http://127.0.0.1:11434"

[intelligence]
default_model = "qwen:latest"
fallback_model = ""
provider = "local"
temperature = 0.7
max_tokens = 1024

[agent]
default_agent = "simple"
max_turns = 10
context_from_memory = true

[tools.storage]
default_backend = "sqlite"
db_path = "~/.grandpa/memory.db"

[server]
host = "127.0.0.1"
port = 8000

[telemetry]
enabled = true
db_path = "~/.grandpa/telemetry.db"

[security]
enabled = true
scan_input = true
scan_output = true
enforce_tool_confirmation = true

[scheduler]
enabled = false
poll_interval = 60
