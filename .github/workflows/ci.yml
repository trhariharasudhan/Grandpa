name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server

      - name: Ruff check
        run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/grandpa-python/Cargo.toml

      - name: Run tests
        run: |
          uv run pytest \
            tests/test_advanced_ai.py \
            tests/test_browser_control.py \
            tests/test_completion_capabilities.py \
            tests/test_core_ai_brain.py \
            tests/test_file_assistant.py \
            tests/test_grandpa_feature_audit.py \
            tests/test_integration_foundations.py \
            tests/test_local_actions.py \
            tests/test_memory_context.py \
            tests/test_pc_control.py \
            tests/test_pc_control_api.py \
            tests/test_response_cleanup.py \
            tests/test_scheduler_daemon.py \
            tests/test_screen_awareness.py \
            tests/test_task_scheduler.py \
            tests/test_windows_app_resolver.py \
            tests/test_windows_window_control.py \
            tests/server/test_routes.py \
            tests/server/test_pwa_serving.py \
            tests/scripts/test_validate_daily_use.py \
            tests/cli/test_doctor_daily_readiness.py \
            -v --tb=short -m "not live and not cloud" \
            --cov=grandpa \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=20

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
