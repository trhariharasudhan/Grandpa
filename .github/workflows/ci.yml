name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs (Actions > CI > Run workflow) are the only trigger for the
  # e2e job below, which needs a local model.
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model for the e2e suite
        required: true
        default: qwen2.5:0.5b

concurrency:
  # Keyed by event too, so a manual e2e run and a push to the same ref do not
  # cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra voice --extra screen

      - name: Ruff check
        run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra voice --extra screen

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/grandpa-python/Cargo.toml

      - name: Run tests
        run: |
          uv run pytest \
            tests/test_advanced_ai.py \
            tests/test_browser_control.py \
            tests/test_completion_capabilities.py \
            tests/test_core_ai_brain.py \
            tests/test_file_assistant.py \
            tests/test_local_actions.py \
            tests/test_memory_context.py \
            tests/test_pc_control.py \
            tests/test_pc_control_api.py \
            tests/test_response_cleanup.py \
            tests/test_scheduler_daemon.py \
            tests/test_screen_awareness.py \
            tests/test_task_scheduler.py \
            tests/test_windows_app_resolver.py \
            tests/test_windows_window_control.py \
            tests/server/test_routes.py \
            tests/scripts/test_validate_daily_use.py \
            tests/cli/test_doctor_daily_readiness.py \
            -v --tb=short -m "not live and not cloud" \
            --cov=grandpa \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=20

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  windows:
    # Grandpa is a Windows-first assistant: pywin32, UIA, SAPI TTS, pyautogui
    # and the whole desktop/automation/screen/voice stack only execute here.
    # Until this job existed CI ran on ubuntu-latest only, so the product's
    # core was never exercised and only the Linux-portable subset -- the
    # inherited platform layer -- was validated.
    #
    # Deliberately does NOT build the Rust extension. Nothing in the Python
    # product loads it (shell_exec was the last Rust-first path and was removed
    # in C2), it is absent from the hatchling-built wheel, and building it here
    # would add an MSVC toolchain dependency for no runtime benefit.
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra voice --extra screen

      - name: Verify the package imports from a clean checkout
        run: uv run python -c "import grandpa.runtime, grandpa.engine, grandpa.security"

      - name: Verify hardware-dependent tests are gated
        # The microphone marker must actually skip by default. If these ever
        # run unguarded they block on real audio hardware and hang the job
        # rather than failing it.
        shell: bash
        run: |
          uv run python -m pytest tests/cli/test_voice_operator_cmd.py -q             | tee result.txt
          grep -q "skipped" result.txt

      - name: Run tests
        # Full deterministic suite. Hardware-dependent tests self-skip unless
        # GRANDPA_RUN_MICROPHONE_TESTS=1; pytest-timeout (timeout = 300 in
        # pyproject.toml) bounds any test that blocks anyway.
        run: uv run pytest -m "not live and not cloud" --tb=short -q

  e2e:
    # The real CLI end to end (tests/e2e): subprocesses in sandboxes, asserting
    # on files, database rows and model output. It needs Ollama and a model,
    # so it runs only on manual dispatch, never on push or pull_request.
    # Exit code 2 means some tests could not run; that is not a pass.
    name: e2e (windows, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra voice --extra screen

      - name: Install Ollama
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ollama"
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip" -OutFile "$dir.zip"
          Expand-Archive -Path "$dir.zip" -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Start Ollama and pull the model
        shell: pwsh
        env:
          E2E_MODEL: ${{ inputs.model }}
        run: |
          Start-Process -FilePath ollama -ArgumentList "serve" -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(60)
          while ($true) {
            try { Invoke-RestMethod -Uri "http://localhost:11434/api/tags" | Out-Null; break }
            catch {
              if ((Get-Date) -gt $deadline) { throw "Ollama did not start within 60s" }
              Start-Sleep -Seconds 1
            }
          }
          ollama pull $env:E2E_MODEL

      - name: Run e2e suite
        env:
          E2E_MODEL: ${{ inputs.model }}
        run: uv run python scripts/run_e2e.py --model "$env:E2E_MODEL"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
