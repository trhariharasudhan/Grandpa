name: Windows Installer

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-windows-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-windows-

      - name: Cache Tauri target
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/target
          key: tauri-target-windows-${{ hashFiles('frontend/src-tauri/Cargo.lock', 'frontend/src-tauri/Cargo.toml', 'frontend/package-lock.json') }}
          restore-keys: |
            tauri-target-windows-

      - name: Print build environment
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
        working-directory: frontend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify Tauri CLI
        run: npx tauri --version
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build Tauri desktop installer
        run: |
          npx tauri build --config '{\"bundle\":{\"createUpdaterArtifacts\":false}}'
        working-directory: frontend

      - name: Collect installer artifacts
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-installer | Out-Null
          if (Test-Path frontend\src-tauri\target\release\bundle) {
            Copy-Item -Path frontend\src-tauri\target\release\bundle\* -Destination artifacts\windows-installer -Recurse -Force
          }
          Get-ChildItem artifacts\windows-installer -Recurse -File | Select-Object FullName,Length

      - name: Upload Windows installer bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grandpa-windows-installer-${{ github.sha }}
          path: |
            artifacts/windows-installer/**/*
            frontend/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 30

      - name: Collect failure logs
        if: failure()
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-logs | Out-Null
          if (Test-Path "$env:LOCALAPPDATA\npm-cache\_logs") {
            Copy-Item "$env:LOCALAPPDATA\npm-cache\_logs\*" artifacts\windows-logs -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path frontend\src-tauri\target\release\build) {
            Get-ChildItem frontend\src-tauri\target\release\build -Recurse -Include "*.log","*.txt" -ErrorAction SilentlyContinue |
              Copy-Item -Destination artifacts\windows-logs -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path frontend\src-tauri\target\debug\build) {
            Get-ChildItem frontend\src-tauri\target\debug\build -Recurse -Include "*.log","*.txt" -ErrorAction SilentlyContinue |
              Copy-Item -Destination artifacts\windows-logs -Force -ErrorAction SilentlyContinue
          }

      - name: Upload failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: grandpa-windows-installer-logs-${{ github.sha }}
          path: artifacts/windows-logs/**/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/**/*Grandpa*.msi
            frontend/src-tauri/target/release/bundle/**/*Grandpa*.exe
            artifacts/windows-installer/**/*
          fail_on_unmatched_files: false
