[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Grandpa"
version = "1.0.1"
description = "Grandpa - personal AI assistant backend with composable intelligence primitives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Grandpa Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8",
    "ddgs>=9.11.4",
    "httpx>=0.27",
    "pillow>=12.1.1",
    "pyautogui>=0.9.54",
    "prompt-toolkit>=3.0",
    "pyttsx3>=2.90; sys_platform == 'win32'",
    "pytesseract>=0.3.13",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.12.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.22",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
tools-search = [
    "tavily-python>=0.3",
    "ddgs>=9.11.4",
]
memory-faiss = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
memory-colbert = [
    "colbert-ai>=0.2",
    "torch>=2.0",
]
memory-pdf = ["pdfplumber>=0.10"]
memory-bm25 = ["rank-bm25>=0.2.2"]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]
gmail = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
calendar = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
browser = ["playwright>=1.40"]
pdf = ["pdfplumber>=0.10"]
scheduler = ["croniter>=2.0"]
security-signing = ["cryptography>=43"]
tray = ["pystray>=0.19.5", "pillow>=12.1.1"]
windows-notifications = ["winotify>=1.1; sys_platform == 'win32'"]
speech = ["faster-whisper>=1.0"]
screen = [
    "mss>=9.0",
    "pywin32>=306; sys_platform == 'win32'",
]
voice = [
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "pyttsx3>=2.90; sys_platform == 'win32'",
    "sounddevice>=0.4.6",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<9.7",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.urls]
Homepage = "https://github.com/trhariharasudhan/Grandpa"
Documentation = "https://github.com/trhariharasudhan/Grandpa/tree/main/docs"
Repository = "https://github.com/trhariharasudhan/Grandpa"
Issues = "https://github.com/trhariharasudhan/Grandpa/issues"

[project.scripts]
grandpa = "grandpa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grandpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "amd: requires AMD hardware or an AMD-specific fixture",
    "apple: requires Apple hardware or an Apple-specific fixture",
    "browser: requires a real browser runtime",
    "core: core deterministic unit/smoke test",
    "environment: depends on machine-specific local state, credentials, devices, or services",
    "integration: cross-component integration test",
    "live: requires running inference engine",
    "microphone: requires microphone hardware and local speech dependencies",
    "nvidia: requires NVIDIA hardware or an NVIDIA-specific fixture",
    "optional: optional feature/dependency test",
    "release: release-gate deterministic test",
    "slow: long-running test",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
exclude = ["*.backup*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
]
